name: Check sitemap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in {1..40}; do
            if curl -sf http://127.0.0.1:8080/sitemap.xml -o /dev/null; then
              echo "Preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start" >&2
          cat preview.log >&2
          exit 1

      - name: Check sitemap
        env:
          BASE_URL: http://127.0.0.1:8080
        run: bun run check:sitemap

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" || true; fi
