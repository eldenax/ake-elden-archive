<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI Use Compass</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1f2328;--muted:#5b616b;--line:#d9d6cc;--accent:#2f5d8a;--accent-soft:#e3ecf5;--rec:#1e6b47;--rec-soft:#e2f2e9;--q1:#e6f2ea;--q2:#fbf1dc;--q3:#e8eaf6;--q4:#f8e3e1;--dot:#2f5d8a;--warn:#b3261e;--focus:#f0a500}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--panel:#202328;--ink:#eceae4;--muted:#a7abb2;--line:#3a3e45;--accent:#8bb4e0;--accent-soft:#263445;--rec:#7fd1a6;--rec-soft:#1d3328;--q1:#1f3328;--q2:#3a321f;--q3:#252a42;--q4:#3d2523;--dot:#8bb4e0;--warn:#f2958e}}
:root[data-theme="dark"]{--bg:#17191c;--panel:#202328;--ink:#eceae4;--muted:#a7abb2;--line:#3a3e45;--accent:#8bb4e0;--accent-soft:#263445;--rec:#7fd1a6;--rec-soft:#1d3328;--q1:#1f3328;--q2:#3a321f;--q3:#252a42;--q4:#3d2523;--dot:#8bb4e0;--warn:#f2958e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1150px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.1rem;margin:0 0 10px}
h3{font-size:1rem;margin:0 0 6px}
p.lead{color:var(--muted);margin:4px 0 18px;max-width:78ch}
a{color:var(--accent)}
.topbar{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.langbox{display:flex;gap:8px;align-items:center}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.step{font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.section-gap{margin-top:18px}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;margin-bottom:16px}
@media(max-width:640px){.work{grid-template-columns:1fr}}
.field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field select,.field input{width:100%}
.rec-wrap{border:1px solid var(--rec);background:var(--rec-soft);border-radius:10px;padding:12px 14px;margin:10px 0 12px}
.rec-wrap>.badge{display:inline-block;margin-bottom:8px}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 18px}
@media(max-width:640px){.rec-grid{grid-template-columns:1fr}}
.rec-item label{font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.badge{font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--rec);color:var(--panel)}
.rec-item p{margin:6px 0 0;font-size:.9rem}
.disc-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
@media(max-width:820px){.disc-opts{grid-template-columns:1fr}}
.disc-extra{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:end;margin-bottom:12px}
@media(max-width:640px){.disc-extra{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
#decl{min-height:190px}
.nudge{font-size:.88rem;color:var(--rec);margin:8px 0 0}
.use{border-top:1px solid var(--line);padding:10px 0}
.use:first-of-type{border-top:0}
.use-head{display:flex;align-items:center;gap:8px}
.use-head label{font-weight:600;cursor:pointer}
.use-body{margin:8px 0 0 28px;display:none}
.use.active .use-body{display:block}
.slider-row{margin:8px 0}
.slider-row label{display:block;font-size:.85rem;color:var(--muted)}
.slider-row .ends{display:flex;justify-content:space-between;gap:10px;font-size:.75rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
select,input[type=text]{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 9px}
.sens{font-size:.85rem;display:flex;gap:6px;align-items:center;margin-top:6px}
.chatbots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;margin:10px 0}
@media(max-width:640px){.chatbots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chatbot{display:flex;gap:7px;align-items:center}
.other-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.other-row input{flex:1;min-width:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{width:100%;height:auto;display:block}
.legend{font-size:.8rem;color:var(--muted);margin-top:8px}
.q-card{border-radius:8px;padding:12px;margin-top:12px}
.q-card ul{margin:6px 0 0;padding-left:20px}
.q-card li{margin-bottom:4px}
.lens{font-weight:600}
textarea{width:100%;min-height:270px;font:inherit;font-size:.93rem;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--panel);cursor:pointer}
button.secondary{background:transparent;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.status{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.warn{margin-top:12px;font-size:.9rem;color:var(--warn)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tool-note{font-size:.88rem;color:var(--muted);margin:4px 0 0}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1 id="title">AI Use Compass</h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langbox">
      <label for="language" id="language-label">Language</label>
      <select id="language">
        <option value="nb">Norsk</option>
        <option value="en">English</option>
        <option value="sv">Svenska</option>
      </select>
    </div>
  </div>

  <div class="steps" id="steps"></div>

  <section class="panel" aria-labelledby="h-tools">
    <h2 id="h-tools"></h2>

    <div class="work">
      <div class="field">
        <label for="work-type" id="work-type-label"></label>
        <select id="work-type"></select>
      </div>
      <div class="field">
        <label for="work-title" id="work-title-label"></label>
        <input id="work-title" type="text">
      </div>
    </div>

    <p class="tool-note" id="tools-help"></p>

    <div class="rec-wrap">
      <span class="badge" id="rec-badge"></span>
      <div class="rec-grid">
        <div class="rec-item">
          <label><input type="checkbox" id="tool-sikt"><span>Sikt KI</span></label>
          <p id="rec-sikt"></p>
          <p><a href="https://www.sikt.no/tjenester/sikt-ki/ki-chat" target="_blank" rel="noopener" id="rec-sikt-link"></a></p>
        </div>
        <div class="rec-item">
          <label><input type="checkbox" id="tool-copilot"><span>Microsoft Copilot</span></label>
          <p id="rec-copilot"></p>
        </div>
      </div>
    </div>

    <div id="chatbots" class="chatbots"></div>
    <div class="other-row"><label for="other-tool" id="other-label"></label><input id="other-tool" type="text"></div>
    <p class="nudge" id="nudge" hidden></p>
  </section>

  <div class="grid section-gap">
    <section class="panel" aria-labelledby="h-uses">
      <h2 id="h-uses"></h2>
      <div id="uses"></div>
    </section>

    <section class="panel" aria-labelledby="h-map">
      <h2 id="h-map"></h2>
      <svg id="map" viewBox="0 0 400 400" role="img" aria-labelledby="map-title map-desc">
        <title id="map-title"></title><desc id="map-desc"></desc>
      </svg>
      <p class="legend" id="legend"></p>
      <div id="reflection" aria-live="polite"></div>
    </section>
  </div>

  <section class="panel section-gap" aria-labelledby="h-log">
    <h2 id="h-log"></h2>
    <p class="status" id="log-help"></p>
    <label for="log" class="sr-only" id="log-label"></label>
    <textarea id="log" readonly></textarea>
    <div class="row">
      <button id="copy" type="button"></button>
      <button id="reset" type="button" class="secondary"></button>
      <button id="dl-log" type="button" class="secondary"></button>
      <span id="copy-status" class="status" role="status"></span>
    </div>
  </section>

  <section class="panel section-gap" aria-labelledby="h-disc">
    <h2 id="h-disc"></h2>
    <p class="status" id="disc-help"></p>
    <div class="disc-opts">
      <div class="field"><label for="d-format" id="d-format-label"></label><select id="d-format"></select></div>
      <div class="field"><label for="d-authors" id="d-authors-label"></label><select id="d-authors"></select></div>
      <div class="field"><label for="d-lang" id="d-lang-label"></label>
        <select id="d-lang"><option value="en">English</option><option value="nb">Norsk</option><option value="sv">Svenska</option></select>
      </div>
    </div>
    <div class="disc-extra">
      <div class="field"><label for="d-details" id="d-details-label"></label><input id="d-details" type="text"></div>
      <label class="check"><input type="checkbox" id="d-noai"><span id="d-noai-label"></span></label>
    </div>
    <label for="decl" class="sr-only" id="decl-label"></label>
    <textarea id="decl" readonly></textarea>
    <div class="row">
      <button id="d-copy" type="button"></button>
      <button id="d-txt" type="button" class="secondary"></button>
      <button id="d-doc" type="button" class="secondary"></button>
      <span id="d-status" class="status" role="status"></span>
    </div>
  </section>
</main>
<script>
(function(){

/* ---------- state ---------- */

function browserLang(){
 try{
  var l = (navigator.language || "").toLowerCase();
  if (/^(nb|nn|no)\b/.test(l)) return "nb";
  if (/^sv\b/.test(l)) return "sv";
 }catch(e){}
 return "en";
}

function defaults(){
 var s = {lang: browserLang(), workType: "article", workTitle: "", tools: {}, otherTool: "", uses: {},
  decl: {fmt: "standard", multi: false, lang: "en", details: "", noAI: false}};
 TOOLS.forEach(function(t){ s.tools[t] = false; });
 USES.forEach(function(id){ s.uses[id] = {on: false, own: 50, trans: 50, sens: false}; });
 return s;
}

function load(){
 var s = defaults();
 try{
  var raw = localStorage.getItem(STORE_KEY);
  if (raw){
   var x = JSON.parse(raw);
   if (T[x.lang]) s.lang = x.lang;
   if (WORK.indexOf(x.workType) >= 0) s.workType = x.workType;
   s.workTitle = typeof x.workTitle === "string" ? x.workTitle : "";
   s.otherTool = typeof x.otherTool === "string" ? x.otherTool : "";
   if (x.tools) TOOLS.forEach(function(t){ s.tools[t] = !!x.tools[t]; });
   if (x.uses) USES.forEach(function(k){ if (x.uses[k]) Object.assign(s.uses[k], x.uses[k]); });
   if (x.decl){
    if (FORMATS.indexOf(x.decl.fmt) >= 0) s.decl.fmt = x.decl.fmt;
    if (T[x.decl.lang]) s.decl.lang = x.decl.lang;
    s.decl.multi = !!x.decl.multi;
    s.decl.noAI = !!x.decl.noAI;
    s.decl.details = typeof x.decl.details === "string" ? x.decl.details : "";
   }
  }
 }catch(e){}
 return s;
}

var state = load();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- helpers ---------- */

function $(id){ return document.getElementById(id); }
function el(tag, attrs, text){
 var e = document.createElement(tag);
 if (attrs) Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
 if (text != null) e.textContent = text;
 return e;
}
var NS = "http://www.w3.org/2000/svg";
function se(tag, attrs, text){
 var e = document.createElementNS(NS, tag);
 Object.keys(attrs || {}).forEach(function(k){ e.setAttribute(k, attrs[k]); });
 if (text != null) e.textContent = text;
 return e;
}
function tx(){ return T[state.lang] || T.en; }
function activeTools(){
 var a = TOOLS.filter(function(t){ return state.tools[t]; });
 var o = state.otherTool.trim();
 if (o) a.push(o);
 return a;
}
function activeUses(){ return USES.filter(function(id){ return state.uses[id].on; }); }
function usesPreferred(){ return PREFERRED.some(function(t){ return state.tools[t]; }); }
function usesCommercial(){
 return OTHER_TOOLS.some(function(t){ return state.tools[t]; }) || state.otherTool.trim() !== "";
}
function quadrant(u){
 var ho = u.own >= 50, ht = u.trans >= 50;
 if (ho && ht) return "q1";
 if (ho) return "q2";
 if (ht) return "q3";
 return "q4";
}

 [[SIKT, "tool-sikt"], [COPILOT, "tool-copilot"]].forEach(function(p){
  var cb = $(p[1]);
  cb.checked = !!state.tools[p[0]];
  cb.onchange = function(){ state.tools[p[0]] = cb.checked; update(); };
 });

 var d = state.decl;
 $("d-format").onchange = function(){ d.fmt = this.value; update(); };
 $("d-authors").onchange = function(){ d.multi = this.value === "multi"; update(); };
 $("d-lang").onchange = function(){ d.lang = this.value; update(); };
 var det = $("d-details");
 det.value = d.details;
 det.oninput = function(){ d.details = det.value; update(); };
 var na = $("d-noai");
 na.checked = d.noAI;
 na.onchange = function(){ d.noAI = na.checked; update(); };

 var box = $("chatbots"); box.innerHTML = "";
 OTHER_TOOLS.forEach(function(t){
  var row = el("label", {"class": "chatbot"});
  var cb = el("input", {type: "checkbox"});
  cb.checked = !!state.tools[t];
  cb.addEventListener("change", function(){ state.tools[t] = cb.checked; update(); });
  row.appendChild(cb);
  row.appendChild(document.createTextNode(t));
  box.appendChild(row);
 });

 var ot = $("other-tool");
 ot.value = state.otherTool;
 ot.oninput = function(){ state.otherTool = ot.value; update(); };

 var wt = $("work-type");
 wt.onchange = function(){ state.workType = wt.value; update(); };
 var ti = $("work-title");
 ti.value = state.workTitle;
 ti.oninput = function(){ state.workTitle = ti.value; update(); };
}

function slider(id, key, label, left, right){
 var row = el("div", {"class": "slider-row"});
 var sid = "s-" + id + "-" + key;
 row.appendChild(el("label", {"for": sid}, label));
 var inp = el("input", {type: "range", min: "0", max: "100", step: "5", id: sid, value: String(state.uses[id][key])});
 inp.addEventListener("input", function(){ state.uses[id][key] = Number(inp.value); update(); });
 row.appendChild(inp);
 var ends = el("div", {"class": "ends", "aria-hidden": "true"});
 ends.appendChild(el("span", null, left));
 ends.appendChild(el("span", null, right));
 row.appendChild(ends);
 return row;
}

function buildUses(){
 var L = tx(), wrap = $("uses");
 wrap.innerHTML = "";
 USES.forEach(function(id){
  var u = state.uses[id];
  var box = el("div", {"class": "use" + (u.on ? " active" : "")});
  var head = el("div", {"class": "use-head"});
  var cb = el("input", {type: "checkbox", id: "c-" + id});
  cb.checked = u.on;
  cb.addEventListener("change", function(){ u.on = cb.checked; box.classList.toggle("active", cb.checked); update(); });
  head.appendChild(cb);
  head.appendChild(el("label", {"for": "c-" + id}, L.uses[id]));
  box.appendChild(head);

  var body = el("div", {"class": "use-body"});
  body.appendChild(slider(id, "own", L.labels.own, L.labels.ownL, L.labels.ownR));
  body.appendChild(slider(id, "trans", L.labels.trans, L.labels.transL, L.labels.transR));
  var sens = el("div", {"class": "sens"});
  var scb = el("input", {type: "checkbox", id: "x-" + id});
  scb.checked = u.sens;
  scb.addEventListener("change", function(){ u.sens = scb.checked; update(); });
  sens.appendChild(scb);
  sens.appendChild(el("label", {"for": "x-" + id}, L.labels.sens));
  body.appendChild(sens);
  box.appendChild(body);
  wrap.appendChild(box);
 });
}

function drawNudge(){
 var n = $("nudge");
 var show = usesCommercial() && !usesPreferred();
 n.hidden = !show;
 n.textContent = show ? tx().nudge : "";
}

function drawMap(){
 var L = tx(), svg = $("map");
 Array.prototype.slice.call(svg.querySelectorAll(":scope > g")).forEach(function(g){ g.remove(); });
 var g = se("g"), P = 40, W = 320, H = W / 2;
 g.appendChild(se("rect", {x: P, y: P, width: H, height: H, fill: "var(--q3)"}));
 g.appendChild(se("rect", {x: P + H, y: P, width: H, height: H, fill: "var(--q1)"}));
 g.appendChild(se("rect", {x: P, y: P + H, width: H, height: H, fill: "var(--q4)"}));
 g.appendChild(se("rect", {x: P + H, y: P + H, width: H, height: H, fill: "var(--q2)"}));
 g.appendChild(se("rect", {x: P, y: P, width: W, height: W, fill: "none", stroke: "var(--line)"}));
 g.appendChild(se("line", {x1: P + H, y1: P, x2: P + H, y2: P + W, stroke: "var(--line)"}));
 g.appendChild(se("line", {x1: P, y1: P + H, x2: P + W, y2: P + H, stroke: "var(--line)"}));

 var lab = {"font-size": "11", fill: "var(--muted)", "font-family": "system-ui,sans-serif"};
 g.appendChild(se("text", Object.assign({x: P + 6, y: P + 16}, lab), L.quad.q3[0]));
 g.appendChild(se("text", Object.assign({x: P + W - 6, y: P + 16, "text-anchor": "end"}, lab), L.quad.q1[0]));
 g.appendChild(se("text", Object.assign({x: P + 6, y: P + W - 8}, lab), L.quad.q4[0]));
 g.appendChild(se("text", Object.assign({x: P + W - 6, y: P + W - 8, "text-anchor": "end"}, lab), L.quad.q2[0]));

 var axis = {"font-size": "11", fill: "var(--ink)", "font-family": "system-ui,sans-serif", "text-anchor": "middle"};
 g.appendChild(se("text", Object.assign({x: 200, y: 385}, axis), L.labels.own + " →"));
 g.appendChild(se("text", Object.assign({x: 14, y: 200, transform: "rotate(-90 14 200)"}, axis), L.labels.trans + " →"));

 activeUses().forEach(function(id, i){
  var u = state.uses[id], cx = P + (u.own / 100) * W, cy = P + W - (u.trans / 100) * W;
  var dot = se("circle", {cx: cx, cy: cy, r: 9, fill: "var(--dot)", stroke: u.sens ? "var(--warn)" : "var(--panel)", "stroke-width": u.sens ? 3 : 2});
  dot.appendChild(se("title", {}, L.uses[id]));
  g.appendChild(dot);
  g.appendChild(se("text", {x: cx, y: cy + 4, "text-anchor": "middle", "font-size": "10", "font-weight": "700", fill: "var(--panel)", "font-family": "system-ui,sans-serif"}, String(i + 1)));
 });
 svg.appendChild(g);
}

function drawReflection(){
 var L = tx(), box = $("reflection"), active = activeUses();
 box.innerHTML = "";
 if (!active.length){ box.appendChild(el("p", {"class": "empty"}, L.emptyReflection)); return; }

 var groups = {};
 active.forEach(function(id, i){
  var q = quadrant(state.uses[id]);
  (groups[q] = groups[q] || []).push((i + 1) + ". " + L.uses[id]);
 });
 ["q4","q3","q2","q1"].forEach(function(q){
  if (!groups[q]) return;
  var Q = L.quad[q], card = el("div", {"class": "q-card"});
  card.style.background = "var(--" + q + ")";
  card.appendChild(el("h3", null, Q[0]));
  card.appendChild(el("p", {style: "margin:0 0 4px;font-size:.9rem"}, groups[q].join(" · ")));
  card.appendChild(el("p", {style: "margin:0;font-size:.9rem"}, Q[1]));
  var ul = el("ul");
  L.lenses.forEach(function(x){
   var li = el("li");
   li.appendChild(el("span", {"class": "lens"}, x[0] + ": "));
   li.appendChild(document.createTextNode(x[1]));
   ul.appendChild(li);
  });
  card.appendChild(ul);
  box.appendChild(card);
 });

 if (active.some(function(id){ return state.uses[id].sens; })){
  box.appendChild(el("p", {"class": "warn"}, L.sensitiveWarning));
  if (usesCommercial()) box.appendChild(el("p", {"class": "warn"}, L.sensitiveCommercial));
 }
}

function writeLog(){
 var L = tx(), tools = activeTools(), active = activeUses();
 var work = L.workPhrase[state.workType] || L.workPhrase.other;
 var title = state.workTitle.trim();
 var lines = [L.logHeading + (title ? " – " + title : ""), ""];
 lines.push(tools.length ? L.sentenceIntro(work, tools) : L.noToolsIntro(work));
 lines.push("");
 if (!active.length){
  lines.push(L.none);
 } else {
  active.forEach(function(id){
   var u = state.uses[id];
   lines.push(L.sentenceUse(L.uses[id], u.own, u.trans, u.sens));
   lines.push("");
  });
  lines.push(L.closing(work));
 }
 $("log").value = lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function listJoin(items, and){
 if (items.length < 2) return items.join("");
 return items.slice(0, -1).join(", ") + " " + and + " " + items[items.length - 1];
}

function declaration(){
 var D = T[state.decl.lang] || T.en, d = state.decl;
 var tools = activeTools(), active = activeUses();
 var details = d.details.trim();
 var toolStr = tools.length ? listJoin(tools, D.and) + (details ? " (" + details + ")" : "") : D.toolsPh;
 var purposes = active.length ? listJoin(active.map(function(id){ return D.purposes[id]; }), D.and) : D.purposePh;
 return D.decl({
  fmt: d.fmt, multi: d.multi, noAI: d.noAI,
  tools: toolStr, n: tools.length, purposes: purposes,
  work: D.workPhrase[state.workType] || D.workPhrase.other,
  low: active.some(function(id){ return state.uses[id].own < 50; })
 });
}

function declText(){
 var r = declaration();
 return r.heading ? r.heading + "\n\n" + r.body : r.body;
}

function writeDecl(){ $("decl").value = declText(); }

function download(name, type, content){
 var a = el("a", {download: name});
 a.href = URL.createObjectURL(new Blob([content], {type: type}));
 document.body.appendChild(a);
 a.click();
 setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function escapeHtml(s){
 return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
}

function copyText(text, ta, status){
 var L = tx();
 function manual(){ ta.select(); status.textContent = L.manualCopy; }
 if (navigator.clipboard && navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(function(){ status.textContent = L.copied; }, manual);
 } else manual();
}

function update(){ save(); drawNudge(); drawMap(); drawReflection(); writeLog(); writeDecl(); }

function renderAll(){ renderStatic(); buildInputs(); buildUses(); update(); }

$("language").addEventListener("change", function(){ state.lang = this.value; renderAll(); });

$("copy").addEventListener("click", function(){ copyText($("log").value, $("log"), $("copy-status")); });
$("dl-log").addEventListener("click", function(){
 download(tx().logFile + ".txt", "text/plain;charset=utf-8", $("log").value);
});

$("d-copy").addEventListener("click", function(){ copyText($("decl").value, $("decl"), $("d-status")); });
$("d-txt").addEventListener("click", function(){
 download(tx().dFile + ".txt", "text/plain;charset=utf-8", declText());
});
$("d-doc").addEventListener("click", function(){
 // Word opens HTML saved with a .doc extension as a normal, editable document.
 var r = declaration(), lang = state.decl.lang;
 var html = "<!doctype html><html lang=\"" + lang + "\"><head><meta charset=\"utf-8\"><title>" + escapeHtml(r.heading || tx().discTitle) + "</title></head>" +
  "<body style=\"font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5\">" +
  (r.heading ? "<h2 style=\"font-size:13pt\">" + escapeHtml(r.heading) + "</h2>" : "") +
  "<p>" + escapeHtml(r.body) + "</p></body></html>";
 download(tx().dFile + ".doc", "application/msword", "\ufeff" + html);
});

$("reset").addEventListener("click", function(){
 var lang = state.lang;
 state = defaults();
 state.lang = lang;
 renderAll();
 $("copy-status").textContent = tx().resetDone;
 $("d-status").textContent = "";
});

renderAll();
})();
</script>
</body>
</html>
