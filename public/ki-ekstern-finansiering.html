<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KI-erklæring for søknader</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1f2328;--muted:#5b616b;--line:#d9d6cc;--accent:#2f5d8a;--accent-soft:#e3ecf5;--rec:#1e6b47;--rec-soft:#e2f2e9;--info:#fbf1dc;--warn:#b3261e;--focus:#f0a500;--risk:#f8e3e1;--s1:#e3ecf5;--s2:#b9d0e8;--s3:#7fa6d1;--s4:#2f5d8a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--panel:#202328;--ink:#eceae4;--muted:#a7abb2;--line:#3a3e45;--accent:#8bb4e0;--accent-soft:#263445;--rec:#7fd1a6;--rec-soft:#1d3328;--info:#3a321f;--warn:#f2958e;--risk:#3d2523;--s1:#1f2a36;--s2:#263f5c;--s3:#3f6c9e;--s4:#8bb4e0}}
:root[data-theme="dark"]{--bg:#17191c;--panel:#202328;--ink:#eceae4;--muted:#a7abb2;--line:#3a3e45;--accent:#8bb4e0;--accent-soft:#263445;--rec:#7fd1a6;--rec-soft:#1d3328;--info:#3a321f;--warn:#f2958e;--risk:#3d2523;--s1:#1f2a36;--s2:#263f5c;--s3:#3f6c9e;--s4:#8bb4e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.1rem;margin:0 0 10px}
p.lead{color:var(--muted);margin:4px 0 18px;max-width:78ch}
a{color:var(--accent)}
.topbar{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.langbox{display:flex;gap:8px;align-items:center}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.step{font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:18px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:640px){.fields{grid-template-columns:1fr}}
.field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field select,.field input{width:100%}
select,input[type=text]{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 9px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.rec-wrap{border:1px solid var(--rec);background:var(--rec-soft);border-radius:10px;padding:12px 14px;margin:10px 0 12px}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 18px;margin-top:8px}
@media(max-width:640px){.rec-grid{grid-template-columns:1fr}}
.rec-item label{font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.rec-item p{margin:6px 0 0;font-size:.9rem}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--rec);color:var(--panel)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;margin:10px 0}
@media(max-width:640px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check.top{align-items:flex-start}
.check.top input{margin-top:3px}
.part{border-top:1px solid var(--line);padding:10px 0}
.part:first-child{border-top:0}
.part-head{font-weight:600}
.part-body{margin:8px 0 0 28px;display:none}
.part.active .part-body{display:block}
.part-body input[type=text]{width:100%;margin-bottom:4px}
.slider-row{margin:8px 0}
.sens{font-size:.85rem;display:flex;gap:6px;align-items:center;margin-top:6px}
.list{display:grid;gap:10px}
.note{font-size:.88rem;color:var(--muted);margin:4px 0 0}
.info{background:var(--info);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-top:12px}
.info p{margin:0}
.info p+p{margin-top:6px}
.warn{color:var(--warn);font-size:.9rem;margin:10px 0 0}
textarea{width:100%;min-height:260px;font:inherit;font-size:.93rem;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--panel);cursor:pointer}
button.secondary{background:transparent;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.status{font-size:.85rem;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.slider-row label{display:block;font-size:.85rem;color:var(--muted)}
.slider-row .ends{display:flex;justify-content:space-between;gap:10px;font-size:.75rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.compass-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
#compass{max-width:520px;margin:0 auto}
svg{width:100%;height:auto;display:block}
table.matrix{width:100%;border-collapse:separate;border-spacing:2px;font-size:.85rem}
.matrix th{font-weight:600;text-align:left;color:var(--muted);padding:4px 6px}
.matrix th.num{text-align:center}
.matrix td{padding:5px 6px;border-radius:4px}
.matrix td.num{text-align:center;font-variant-numeric:tabular-nums}
.matrix tr.avg td{font-weight:700}
.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4);color:var(--panel)}
.hints{margin:10px 0 0;padding-left:20px;font-size:.9rem}
.hints li{margin-bottom:4px}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:.92rem;margin:0 0 12px}
.meta dt{font-weight:600}.meta dd{margin:0}
.print-only{display:none}
@media print{
 body{background:#fff}
 main{padding:0;max-width:none}
 main>*:not(#compass-panel){display:none!important}
 #compass-panel{border:0;padding:0;margin:0}
 .no-print{display:none!important}
 .print-only{display:block!important}
 dl.print-only{display:grid!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langbox">
      <label for="language" id="language-label"></label>
      <select id="language"><option value="nb">Norsk</option><option value="en">English</option></select>
    </div>
  </div>

  <div class="steps" id="steps"></div>

  <!-- 1 -->
  <section class="panel" aria-labelledby="h-app">
    <h2 id="h-app"></h2>
    <div class="fields">
      <div class="field"><label for="funder" id="funder-label"></label><select id="funder"></select></div>
      <div class="field" id="funder-name-box"><label for="funder-name" id="funder-name-label"></label><input id="funder-name" type="text"></div>
      <div class="field"><label for="call" id="call-label"></label><input id="call" type="text"></div>
      <div class="field"><label for="app-title" id="app-title-label"></label><input id="app-title" type="text"></div>
      <div class="field"><label for="applicant" id="applicant-label"></label><select id="applicant"></select></div>
      <div class="field" id="partners-box"><label for="partners" id="partners-label"></label><input id="partners" type="text"></div>
    </div>
    <div class="info" id="funder-tip"></div>
  </section>

  <!-- 2 -->
  <section class="panel" aria-labelledby="h-tools">
    <h2 id="h-tools"></h2>
    <p class="note" id="tools-help"></p>
    <div class="rec-wrap">
      <span class="badge" id="rec-badge"></span>
      <div class="rec-grid">
        <div class="rec-item">
          <label><input type="checkbox" id="tool-sikt"><span>Sikt KI</span></label>
          <p id="rec-sikt"></p>
          <p><a href="https://www.sikt.no/tjenester/sikt-ki/ki-chat" target="_blank" rel="noopener" id="rec-sikt-link"></a></p>
        </div>
        <div class="rec-item">
          <label><input type="checkbox" id="tool-copilot"><span>Microsoft Copilot</span></label>
          <p id="rec-copilot"></p>
        </div>
      </div>
    </div>
    <div class="tools" id="tools"></div>
    <div class="fields">
      <div class="field"><label for="other-tool" id="other-tool-label"></label><input id="other-tool" type="text"></div>
      <div class="field"><label for="details" id="details-label"></label><input id="details" type="text"></div>
    </div>
    <p class="warn" id="tool-warn" hidden></p>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="no-ai"><span id="no-ai-label"></span></label>
  </section>

  <!-- 3 -->
  <section class="panel" aria-labelledby="h-parts" id="parts-panel">
    <h2 id="h-parts"></h2>
    <p class="note" id="parts-help"></p>
    <div id="parts"></div>
  </section>

  <!-- 4 -->
  <section class="panel" aria-labelledby="h-resp" id="resp-panel">
    <h2 id="h-resp"></h2>
    <p class="note" id="resp-help"></p>
    <div class="list" id="confirms" style="margin-top:10px"></div>
    <div class="field" style="margin-top:12px"><label for="extra" id="extra-label"></label><input id="extra" type="text"></div>
    <p class="warn" id="conf-warn" hidden></p>
    <p class="warn" id="sens-warn" hidden></p>
    <div class="info" id="reviewer"></div>
  </section>

  <!-- 5 -->
  <section class="panel" aria-labelledby="h-compass" id="compass-panel">
    <h2 id="h-compass" class="no-print"></h2>
    <h2 class="print-only" id="report-title"></h2>
    <dl class="meta print-only" id="report-meta"></dl>
    <p class="note no-print" id="compass-help"></p>
    <p class="note" id="compass-empty"></p>
    <div class="compass-grid" id="compass-body">
      <div>
        <svg id="compass" viewBox="0 0 560 420" role="img" aria-labelledby="compass-title compass-desc">
          <title id="compass-title"></title><desc id="compass-desc"></desc>
        </svg>
      </div>
      <div>
        <table class="matrix" id="matrix"></table>
        <ul class="hints" id="hints"></ul>
        <p class="note" id="legend"></p>
      </div>
    </div>
    <div class="print-only" id="report-decl"></div>
    <div class="row no-print">
      <button id="print" type="button"></button>
      <button id="svg-dl" type="button" class="secondary"></button>
    </div>
  </section>

  <!-- 6 -->
  <section class="panel" aria-labelledby="h-decl">
    <h2 id="h-decl"></h2>
    <p class="note" id="decl-help"></p>
    <div class="fields" style="margin:10px 0 12px">
      <div class="field"><label for="d-format" id="d-format-label"></label><select id="d-format"></select></div>
      <div class="field"><label for="d-lang" id="d-lang-label"></label>
        <select id="d-lang"><option value="nb">Norsk</option><option value="en">English</option></select>
      </div>
    </div>
    <label for="decl" class="sr-only" id="decl-label"></label>
    <textarea id="decl" readonly></textarea>
    <div class="row">
      <button id="d-copy" type="button"></button>
      <button id="d-txt" type="button" class="secondary"></button>
      <button id="d-doc" type="button" class="secondary"></button>
      <button id="reset" type="button" class="secondary"></button>
      <span id="d-status" class="status" role="status"></span>
    </div>
  </section>
</main>

/* ---------- state ---------- */

function defaults(){
 var s = {lang: "nb", funder: "nfr", funderName: "", call: "", title: "", multi: false, partners: "",
  tools: {}, otherTool: "", details: "", noAI: false, parts: {}, otherPart: "", c: {}, extra: "",
  format: "full", dLang: "nb"};
 TOOLS.forEach(function(t){ s.tools[t] = false; });
 PARTS.forEach(function(p){ s.parts[p] = {on: false, own: 50, check: 50, trans: 50, secure: 50, sens: false}; });
 CONFIRMS.forEach(function(c){ s.c[c] = false; });
 return s;
}

function load(){
 var s = defaults();
 try{
  var x = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (x){
   if (T[x.lang]) s.lang = x.lang;
   if (T[x.dLang]) s.dLang = x.dLang;
   if (FUNDERS.indexOf(x.funder) >= 0) s.funder = x.funder;
   if (FORMATS.indexOf(x.format) >= 0) s.format = x.format;
   ["funderName","call","title","partners","otherTool","details","otherPart","extra"].forEach(function(k){
    if (typeof x[k] === "string") s[k] = x[k];
   });
   s.multi = !!x.multi; s.noAI = !!x.noAI;
   if (x.tools) TOOLS.forEach(function(t){ s.tools[t] = !!x.tools[t]; });
   if (x.parts) PARTS.forEach(function(p){
    if (!x.parts[p]) return;
    s.parts[p].on = !!x.parts[p].on;
    s.parts[p].sens = !!x.parts[p].sens;
    DIMS.forEach(function(d){
     var v = Number(x.parts[p][d]);
     if (isFinite(v)) s.parts[p][d] = Math.max(0, Math.min(100, v));
    });
   });
   if (x.c) CONFIRMS.forEach(function(c){ s.c[c] = !!x.c[c]; });
  }
 }catch(e){}
 return s;
}

var state = load();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- helpers ---------- */

function $(id){ return document.getElementById(id); }
function el(tag, attrs, text){
 var e = document.createElement(tag);
 if (attrs) Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
 if (text != null) e.textContent = text;
 return e;
}
function tx(){ return T[state.lang] || T.nb; }
function fillSelect(sel, keys, labels, value){
 sel.innerHTML = "";
 keys.forEach(function(k){ sel.appendChild(el("option", {value: k}, labels[k])); });
 sel.value = value;
}
function bindText(id, key){
 var inp = $(id);
 inp.value = state[key];
 inp.oninput = function(){ state[key] = inp.value; update(); };
}
function listJoin(items, and){
 if (items.length < 2) return items.join("");
 return items.slice(0, -1).join(", ") + " " + and + " " + items[items.length - 1];
}
function activeTools(){
 var a = TOOLS.filter(function(t){ return state.tools[t]; });
 var o = state.otherTool.trim();
 if (o) a.push(o);
 return a;
}
function preferredUsed(){ return PREFERRED.filter(function(t){ return state.tools[t]; }); }
function othersUsed(){
 return OTHER_TOOLS.some(function(t){ return state.tools[t]; }) || state.otherTool.trim() !== "";
}

/* ---------- rendering ---------- */

function setText(map){ Object.keys(map).forEach(function(id){ $(id).textContent = map[id]; }); }
function setPh(map){ Object.keys(map).forEach(function(id){ $(id).placeholder = map[id]; }); }

function renderStatic(){
 var L = tx();
 document.documentElement.lang = state.lang;
 document.title = L.title;
 $("language").value = state.lang;
 setText({"title": L.title, "lead": L.lead, "language-label": L.language,
  "h-app": L.hApp, "funder-label": L.funder, "funder-name-label": L.funderName, "call-label": L.call,
  "app-title-label": L.appTitle, "applicant-label": L.applicant, "partners-label": L.partners,
  "h-tools": L.hTools, "tools-help": L.toolsHelp, "rec-badge": L.recBadge, "rec-sikt": L.recSikt,
  "rec-sikt-link": L.recSiktLink, "rec-copilot": L.recCopilot, "other-tool-label": L.otherTool,
  "details-label": L.details, "no-ai-label": L.noAI,
  "h-parts": L.hParts, "parts-help": L.partsHelp,
  "h-resp": L.hResp, "resp-help": L.respHelp, "extra-label": L.extra,
  "h-decl": L.hDecl, "decl-help": L.declHelp, "d-format-label": L.dFormat, "d-lang-label": L.dLang,
  "decl-label": L.hDecl, "d-copy": L.dCopy, "d-txt": L.dTxt, "d-doc": L.dDoc, "reset": L.reset});
 setPh({"funder-name": L.funderNamePh, "call": L.callPh, "app-title": L.appTitlePh, "partners": L.partnersPh,
  "other-tool": L.otherToolPh, "details": L.detailsPh, "extra": L.extraPh});

 var st = $("steps"); st.innerHTML = "";
 L.steps.forEach(function(x){ st.appendChild(el("span", {"class": "step"}, x)); });

 fillSelect($("funder"), FUNDERS, L.funders, state.funder);
 fillSelect($("applicant"), ["single","multi"], L.applicants, state.multi ? "multi" : "single");
 fillSelect($("d-format"), FORMATS, L.formats, state.format);
 $("d-lang").value = state.dLang;

 setText({"h-compass": L.hCompass, "compass-help": L.compassHelp, "compass-empty": L.compassEmpty,
  "compass-title": L.compassTitle, "compass-desc": L.compassDesc, "report-title": L.reportTitle,
  "print": L.print, "svg-dl": L.svgDl});

 var rv = $("reviewer"); rv.innerHTML = "";
 rv.appendChild(el("p", null)).appendChild(el("strong", null, L.reviewer[0]));
 rv.appendChild(el("p", null, L.reviewer[1]));
}

function buildInputs(){
 var L = tx();
 $("funder").onchange = function(){ state.funder = this.value; update(); };
 $("applicant").onchange = function(){ state.multi = this.value === "multi"; buildConfirms(); update(); };
 $("d-format").onchange = function(){ state.format = this.value; update(); };
 $("d-lang").onchange = function(){ state.dLang = this.value; update(); };
 ["funder-name:funderName","call:call","app-title:title","partners:partners","other-tool:otherTool","details:details","extra:extra"]
  .forEach(function(p){ var a = p.split(":"); bindText(a[0], a[1]); });

 [[SIKT, "tool-sikt"], [COPILOT, "tool-copilot"]].forEach(function(p){
  var cb = $(p[1]);
  cb.checked = !!state.tools[p[0]];
  cb.onchange = function(){ state.tools[p[0]] = cb.checked; update(); };
 });
 var box = $("tools"); box.innerHTML = "";
 OTHER_TOOLS.forEach(function(t){
  var row = el("label", {"class": "check"});
  var cb = el("input", {type: "checkbox"});
  cb.checked = !!state.tools[t];
  cb.onchange = function(){ state.tools[t] = cb.checked; update(); };
  row.appendChild(cb); row.appendChild(document.createTextNode(t));
  box.appendChild(row);
 });

 var na = $("no-ai");
 na.checked = state.noAI;
 na.onchange = function(){ state.noAI = na.checked; update(); };

 var wrap = $("parts"); wrap.innerHTML = "";
 PARTS.forEach(function(p){
  var P = state.parts[p];
  var item = el("div", {"class": "part" + (P.on ? " active" : "")});
  var head = el("label", {"class": "check part-head"});
  var cb = el("input", {type: "checkbox"});
  cb.checked = P.on;
  cb.onchange = function(){ P.on = cb.checked; item.classList.toggle("active", cb.checked); update(); };
  head.appendChild(cb);
  head.appendChild(el("span", null, L.parts[p]));
  item.appendChild(head);
  var body = el("div", {"class": "part-body"});
  if (p === "other"){
   var ot = el("input", {type: "text", "aria-label": L.parts.other, placeholder: L.otherPartPh});
   ot.value = state.otherPart;
   ot.oninput = function(){ state.otherPart = ot.value; update(); };
   body.appendChild(ot);
  }
  DIMS.forEach(function(d){ body.appendChild(slider(p, d, L.dims[d])); });
  var sens = el("label", {"class": "sens"});
  var scb = el("input", {type: "checkbox"});
  scb.checked = P.sens;
  scb.onchange = function(){ P.sens = scb.checked; update(); };
  sens.appendChild(scb); sens.appendChild(document.createTextNode(L.sens));
  body.appendChild(sens);
  item.appendChild(body);
  wrap.appendChild(item);
 });

 buildConfirms();
}

function slider(p, d, labels){
 var row = el("div", {"class": "slider-row"});
 var id = "s-" + p + "-" + d;
 row.appendChild(el("label", {"for": id}, labels[1]));
 var inp = el("input", {type: "range", min: "0", max: "100", step: "5", id: id, value: String(state.parts[p][d])});
 inp.oninput = function(){ state.parts[p][d] = Number(inp.value); update(); };
 row.appendChild(inp);
 var ends = el("div", {"class": "ends", "aria-hidden": "true"});
 ends.appendChild(el("span", null, labels[2]));
 ends.appendChild(el("span", null, labels[3]));
 row.appendChild(ends);
 return row;
}

function buildConfirms(){
 var L = tx(), box = $("confirms"); box.innerHTML = "";
 CONFIRMS.forEach(function(c){
  if (c === "consent" && !state.multi) return;
  var row = el("label", {"class": "check top"});
  var cb = el("input", {type: "checkbox"});
  cb.checked = state.c[c];
  cb.onchange = function(){ state.c[c] = cb.checked; update(); };
  row.appendChild(cb); row.appendChild(el("span", null, L.confirms[c]));
  box.appendChild(row);
 });
}

function drawDynamic(){
 var L = tx();
 $("funder-name-box").hidden = NAMED.indexOf(state.funder) < 0;
 $("partners-box").hidden = !state.multi;
 $("funder-tip").textContent = L.tips[state.funder] || L.tips.other;
 $("parts-panel").hidden = state.noAI;
 $("resp-panel").hidden = state.noAI;

 var tw = $("tool-warn");
 tw.hidden = !(othersUsed() && !preferredUsed().length);
 tw.textContent = L.toolWarn;
 var cw = $("conf-warn");
 cw.hidden = !(state.c.conf && othersUsed());
 cw.textContent = L.confWarn;
 var anySens = PARTS.some(function(p){ return state.parts[p].on && state.parts[p].sens; });
 var sc = $("sens-warn");
 sc.hidden = !(state.c.personal && anySens);
 sc.textContent = L.sensConflict;
}

/* ---------- declaration ---------- */

function declaration(){
 var D = T[state.dLang].D;
 var tools = activeTools(), details = state.details.trim();
 var name = state.funderName.trim();
 var funder = NAMED.indexOf(state.funder) >= 0 && name ? name : D.funderNames[state.funder];
 var partName = function(p){ return p === "other" ? state.otherPart.trim() : D.partNames[p]; };
 var on = PARTS.filter(function(p){ return state.parts[p].on && partName(p); });
 var byLevel = function(lv){
  return listJoin(on.filter(function(p){ return FIXED.indexOf(p) < 0 && levelOf(p) === lv; }).map(partName), D.and);
 };
 var pref = preferredUsed();
 var o = {
  format: state.format, multi: state.multi, noAI: state.noAI,
  funder: funder, call: state.call.trim(), title: state.title.trim(),
  partners: state.multi ? state.partners.trim() : "",
  tools: tools.length ? listJoin(tools, D.and) + (details ? " (" + details + ")" : "") : D.toolsPh,
  preferred: listJoin(pref, D.and), nPreferred: pref.length,
  any: on.length > 0,
  allParts: listJoin(on.map(partName), D.and),
  support: byLevel("support"), draft: byLevel("draft"),
  parts: {lit: on.indexOf("lit") >= 0, lang: on.indexOf("lang") >= 0},
  c: {conf: state.c.conf, personal: state.c.personal, orig: state.c.orig, consent: state.multi && state.c.consent},
  extra: state.extra.trim()
 };
 return {heading: D.heading, body: D.build(o).join(" ")};
}

// Ownership below the midpoint means AI produced drafts; otherwise AI supported the applicant's own text.
function levelOf(p){ return state.parts[p].own < 50 ? "draft" : "support"; }

function declText(){ var r = declaration(); return r.heading + "\n\n" + r.body; }

function download(name, type, content){
 var a = el("a", {download: name});
 a.href = URL.createObjectURL(new Blob([content], {type: type}));
 document.body.appendChild(a);
 a.click();
 setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
function escapeHtml(s){
 return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
}

/* ---------- compass ---------- */

var NS = "http://www.w3.org/2000/svg";
function se(tag, attrs, text){
 var e = document.createElementNS(NS, tag);
 Object.keys(attrs || {}).forEach(function(k){ e.setAttribute(k, attrs[k]); });
 if (text != null) e.textContent = text;
 return e;
}
function activeParts(){ return PARTS.filter(function(p){ return state.parts[p].on; }); }
function partLabel(p){ return p === "other" && state.otherPart.trim() ? state.otherPart.trim() : tx().parts[p]; }
function averages(parts){
 var a = {};
 DIMS.forEach(function(d){
  a[d] = Math.round(parts.reduce(function(sum, p){ return sum + state.parts[p][d]; }, 0) / parts.length);
 });
 return a;
}
function step(v){ return v < 25 ? "s1" : v < 50 ? "s2" : v < 75 ? "s3" : "s4"; }

var CX = 280, CY = 210, R = 150;
// north, east, south, west
var DIR = {own: [0, -1], check: [1, 0], trans: [0, 1], secure: [-1, 0]};
function pt(d, v){ var k = R * v / 100; return [CX + DIR[d][0] * k, CY + DIR[d][1] * k]; }

function drawCompass(){
 var L = tx(), svg = $("compass"), parts = activeParts();
 Array.prototype.slice.call(svg.querySelectorAll(":scope > g")).forEach(function(g){ g.remove(); });
 $("compass-empty").hidden = parts.length > 0 || state.noAI;
 $("compass-body").hidden = !parts.length || state.noAI;
 if (!parts.length || state.noAI) return;

 var g = se("g"), avg = averages(parts);
 var font = "system-ui,-apple-system,sans-serif";

 // risk zone and rings
 g.appendChild(se("circle", {cx: CX, cy: CY, r: R / 2, fill: "var(--risk)"}));
 [25, 50, 75, 100].forEach(function(v){
  g.appendChild(se("circle", {cx: CX, cy: CY, r: R * v / 100, fill: "none", stroke: "var(--line)", "stroke-width": 1}));
 });
 // ring values and the risk-zone label sit on the diagonals, away from the axes
 var diag = Math.SQRT1_2;
 [50, 100].forEach(function(v){
  var r = R * v / 100;
  g.appendChild(se("text", {x: CX + r * diag + 3, y: CY - r * diag - 3, "font-size": 9, fill: "var(--muted)", "font-family": font}, String(v)));
 });
 g.appendChild(se("text", {x: CX - R / 2 * diag, y: CY + R / 2 * diag + 4, "font-size": 10, fill: "var(--muted)", "font-family": font, "text-anchor": "middle"}, L.riskZone));

 // axes and labels
 DIMS.forEach(function(d){
  var e = pt(d, 100);
  g.appendChild(se("line", {x1: CX, y1: CY, x2: e[0], y2: e[1], stroke: "var(--line)", "stroke-width": 1}));
  var dx = DIR[d][0], dy = DIR[d][1];
  var lx = e[0] + dx * 10, ly = e[1] + dy * 16 + (dx ? 4 : 0) + (dy < 0 ? 4 : 0);
  g.appendChild(se("text", {x: lx, y: ly, "font-size": 13, "font-weight": 600, fill: "var(--ink)", "font-family": font,
   "text-anchor": dx > 0 ? "start" : dx < 0 ? "end" : "middle"}, L.dims[d][0]));
 });

 // each part as a small dot on each axis
 parts.forEach(function(p){
  DIMS.forEach(function(d){
   var c = pt(d, state.parts[p][d]);
   var sens = state.parts[p].sens;
   var dot = se("circle", {cx: c[0], cy: c[1], r: sens ? 5 : 4, fill: "var(--muted)", "fill-opacity": .55,
    stroke: sens ? "var(--warn)" : "none", "stroke-width": sens ? 2 : 0});
   dot.appendChild(se("title", {}, partLabel(p) + " – " + L.dims[d][0] + ": " + state.parts[p][d]));
   g.appendChild(dot);
  });
 });

 // average shape
 var pts = DIMS.map(function(d){ return pt(d, avg[d]).join(","); }).join(" ");
 g.appendChild(se("polygon", {points: pts, fill: "var(--accent)", "fill-opacity": .18, stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round"}));
 DIMS.forEach(function(d){
  var c = pt(d, avg[d]);
  var dot = se("circle", {cx: c[0], cy: c[1], r: 6, fill: "var(--accent)", stroke: "var(--panel)", "stroke-width": 2});
  dot.appendChild(se("title", {}, L.avg + " – " + L.dims[d][0] + ": " + avg[d]));
  g.appendChild(dot);
 });
 svg.appendChild(g);

 // table
 var t = $("matrix"); t.innerHTML = "";
 var head = el("tr");
 head.appendChild(el("th", null, L.partCol));
 DIMS.forEach(function(d){ head.appendChild(el("th", {"class": "num"}, L.dims[d][0])); });
 t.appendChild(head);
 parts.forEach(function(p){
  var tr = el("tr");
  tr.appendChild(el("td", null, partLabel(p) + (state.parts[p].sens ? " ⚠" : "")));
  DIMS.forEach(function(d){ var v = state.parts[p][d]; tr.appendChild(el("td", {"class": "num " + step(v)}, String(v))); });
  t.appendChild(tr);
 });
 var ar = el("tr", {"class": "avg"});
 ar.appendChild(el("td", null, L.avg));
 DIMS.forEach(function(d){ ar.appendChild(el("td", {"class": "num " + step(avg[d])}, String(avg[d]))); });
 t.appendChild(ar);

 // hints for dimensions in the risk zone
 var h = $("hints"); h.innerHTML = "";
 var low = DIMS.filter(function(d){ return avg[d] < 50; });
 var flagged = [];
 parts.forEach(function(p){
  DIMS.forEach(function(d){
   if (avg[d] >= 50 && state.parts[p][d] < 25) flagged.push(L.partLow(partLabel(p), L.dims[d][0], state.parts[p][d]));
  });
 });
 if (!low.length && !flagged.length) h.appendChild(el("li", null, L.allGood));
 low.forEach(function(d){ h.appendChild(el("li", null, L.hints[d])); });
 flagged.forEach(function(t){ h.appendChild(el("li", null, t)); });
 var sensParts = parts.filter(function(p){ return state.parts[p].sens; }).map(partLabel);
 if (sensParts.length) h.appendChild(el("li", {"class": "warn"}, "⚠ " + L.sensHint(listJoin(sensParts, T[state.lang].D.and))));
 $("legend").textContent = sensParts.length ? L.legend : "";
}

function drawReport(){
 var L = tx(), D = T[state.lang].D, m = $("report-meta");
 m.innerHTML = "";
 var name = state.funderName.trim();
 var rows = [
  [L.meta.funder, NAMED.indexOf(state.funder) >= 0 && name ? name : L.funders[state.funder]],
  [L.meta.call, state.call.trim()],
  [L.meta.title, state.title.trim()],
  [L.meta.applicant, L.applicants[state.multi ? "multi" : "single"] + (state.multi && state.partners.trim() ? " – " + state.partners.trim() : "")],
  [L.meta.tools, listJoin(activeTools(), D.and)],
  [L.meta.date, new Date().toLocaleDateString(state.lang === "nb" ? "nb-NO" : "en-GB")]
 ];
 rows.forEach(function(r){ if (!r[1]) return; m.appendChild(el("dt", null, r[0])); m.appendChild(el("dd", null, r[1])); });
 var rd = $("report-decl"); rd.innerHTML = "";
 var r = declaration();
 rd.appendChild(el("h3", null, r.heading));
 rd.appendChild(el("p", null, r.body));
}

function update(){ save(); drawDynamic(); drawCompass(); drawReport(); $("decl").value = declText(); }
function renderAll(){ renderStatic(); buildInputs(); update(); }

$("language").addEventListener("change", function(){ state.lang = this.value; renderAll(); });

$("d-copy").addEventListener("click", function(){
 var L = tx(), ta = $("decl"), st = $("d-status");
 function manual(){ ta.select(); st.textContent = L.manualCopy; }
 if (navigator.clipboard && navigator.clipboard.writeText){
  navigator.clipboard.writeText(ta.value).then(function(){ st.textContent = L.copied; }, manual);
 } else manual();
});
$("d-txt").addEventListener("click", function(){
 download(tx().file + ".txt", "text/plain;charset=utf-8", declText());
});
$("d-doc").addEventListener("click", function(){
 // Word opens HTML saved with a .doc extension as a normal, editable document.
 var r = declaration();
 var html = "<!doctype html><html lang=\"" + state.dLang + "\"><head><meta charset=\"utf-8\"><title>" + escapeHtml(r.heading) + "</title></head>" +
  "<body style=\"font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5\">" +
  "<h2 style=\"font-size:13pt\">" + escapeHtml(r.heading) + "</h2><p>" + escapeHtml(r.body) + "</p></body></html>";
 download(tx().file + ".doc", "application/msword", "﻿" + html);
});
$("print").addEventListener("click", function(){ drawReport(); window.print(); });
$("svg-dl").addEventListener("click", function(){
 // Resolve CSS variables so the downloaded SVG looks the same outside this page.
 var cs = getComputedStyle(document.documentElement);
 var clone = $("compass").cloneNode(true);
 clone.setAttribute("xmlns", NS);
 clone.insertBefore(se("rect", {x: 0, y: 0, width: 560, height: 420, fill: "var(--panel)"}), clone.querySelector("g"));
 var src = new XMLSerializer().serializeToString(clone).replace(/var\(--([a-z0-9-]+)\)/g, function(_, v){ return cs.getPropertyValue("--" + v).trim(); });
 download(tx().svgFile + ".svg", "image/svg+xml", src);
});

$("reset").addEventListener("click", function(){
 var lang = state.lang;
 state = defaults();
 state.lang = lang;
 state.dLang = lang;
 renderAll();
 $("d-status").textContent = tx().resetDone;
});

renderAll();
})();
</script>
</body>
</html>
